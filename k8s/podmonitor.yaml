apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nebula-arena-pod-monitor
  namespace: default
  labels:
    app: nebula-arena
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: nebula-arena
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
      honorLabels: true
